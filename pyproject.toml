[project]
name = "slo-sentinel"
version = "0.1.0"
description = "Uptime and SLO monitor on Cloudflare Python Workers, FastAPI and D1"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Pinned below 0.142 to match Cloudflare's tested Python Workers example.
    "fastapi<0.142",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "httpx2>=2.16",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["**/python_modules", "**/.venv-workers"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
# Provided by the Workers runtime, not PyPI.
known-third-party = ["asgi", "js", "pyodide", "workers"]
known-first-party = ["slo_sentinel"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["slo_sentinel"]
strict = true
warn_unreachable = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["slo_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true